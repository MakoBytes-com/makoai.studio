name: Dependency audit

# Reports `npm audit` to the Mako portal, split production vs full scope.
#
# WHY: the portal reads GitHub's Dependabot alerts, which never see dev-only
# transitive findings — that is how a real advisory sat unseen on a repo
# showing "0 alerts". The portal has no checkout and cannot run npm audit
# itself, so the repo runs it and reports in.
#
# The split matters: a production finding is exposure, a dev-only finding is
# hygiene. Reporting one number for both is how the real one gets ignored.

on:
  schedule:
    - cron: "20 6 * * 1" # Mondays, before the fleet's working week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Is the updater itself still alive?
  #
  # WHY (added 2026-08-14): an EOVERRIDE in package.json killed Dependabot's
  # own update job on 2026-08-03. Because the thing that failed was the
  # updater, no PR was ever opened again — so there was nothing red to see.
  # CI passed, gitleaks passed, and this very audit reported "0 findings",
  # because npm audit reads a lockfile that nobody was updating any more. The
  # repo looked healthier than it had ever been while receiving no security
  # updates at all, for 11 days.
  #
  # Every other check here answers "is the code clean?". This one answers "is
  # the machine that keeps it clean still running?" — the question whose
  # silence is indistinguishable from good news.
  dependabot-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check Dependabot's own update jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Resolve the workflow by NAME, then read that workflow's own run
          # history. Do not filter the repo-wide /actions/runs feed: that
          # returns the most recent runs across ALL workflows, and on an active
          # repo the Dependabot runs scroll off it within days. The first cut of
          # this check did exactly that, found zero rows, and reported healthy —
          # while the updater had been dead for eleven days. Its own blind spot
          # was the bug it was written to catch.
          #
          # The path is "dynamic/dependabot/dependabot-updates", which the
          # by-path API rejects with a 404, so go via the numeric id.
          WORKFLOW_ID=$(gh api "repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.name == "Dependabot Updates") | .id' | head -1)

          if [ -z "$WORKFLOW_ID" ]; then
            echo "Could not find a 'Dependabot Updates' workflow on $REPO."
            echo "Dependabot may be disabled entirely. UNKNOWN IS NOT ZERO — failing."
            exit 1
          fi

          gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=50" --jq \
            '[.workflow_runs[]
              | select(.status == "completed")
              | {name: .display_title, conclusion, created_at, url: .html_url}]' > runs.json

          node -e '
            const runs = require("./runs.json");
            if (runs.length === 0) {
              console.error("The Dependabot Updates workflow exists but has never completed a run.");
              console.error("UNKNOWN IS NOT ZERO — that is not evidence of health. Failing.");
              process.exit(1);
            }

            // Runs are titled "<ecosystem> in /<dir> - Update #<n>", plus
            // security runs titled "<ecosystem> in /<dir> for <pkg> - ...".
            // Group by ecosystem so a healthy github-actions run can never
            // mask a dead npm updater — they fail independently.
            const latest = new Map();
            for (const run of runs) {
              const ecosystem = run.name.split(" in ")[0].trim();
              const seen = latest.get(ecosystem);
              if (!seen || new Date(run.created_at) > new Date(seen.created_at)) {
                latest.set(ecosystem, run);
              }
            }

            const dead = [];
            for (const [ecosystem, run] of latest) {
              const ok = run.conclusion === "success";
              console.log(`${ok ? "ok  " : "FAIL"}  ${ecosystem}  ${run.created_at}  ${run.name}`);
              if (!ok) dead.push({ ecosystem, ...run });
            }

            if (dead.length > 0) {
              console.error("\nDependabot is not delivering updates for: " +
                dead.map((d) => d.ecosystem).join(", "));
              console.error(
                "\nThe most recent update job FAILED, which means no pull request will be\n" +
                "opened for any future advisory in that ecosystem. This is a broken\n" +
                "security pipeline, not a flaky build — npm audit will keep reporting a\n" +
                "clean lockfile precisely because nothing is updating it.\n");
              for (const d of dead) console.error("  " + d.url);
              process.exit(1);
            }

            console.log("\nDependabot is delivering updates in every ecosystem.");
          '

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm ci` on purpose: `npm audit` reads the lockfile, and a repo
      # whose install is broken is exactly the one whose audit must still be
      # reported rather than skipped.
      - name: Audit production scope
        id: prod
        run: |
          npm audit --omit=dev --json > prod.json 2>/dev/null || true
          echo "ok=$( [ -s prod.json ] && echo yes || echo no )" >> "$GITHUB_OUTPUT"

      - name: Audit full scope
        run: npm audit --json > dev.json 2>/dev/null || true

      - name: Report to the portal
        env:
          PORTAL_URL: https://portal.makoai.studio
          PORTAL_INGEST_SECRET: ${{ secrets.PORTAL_INGEST_SECRET }}
        run: |
          if [ -z "$PORTAL_INGEST_SECRET" ]; then
            echo "PORTAL_INGEST_SECRET not set — skipping report."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const read = (f) => {
              try { return JSON.parse(fs.readFileSync(f, "utf8")); }
              catch { return null; }
            };
            const sev = (j) => {
              const v = j && j.metadata && j.metadata.vulnerabilities;
              return v
                ? { critical: v.critical|0, high: v.high|0, moderate: v.moderate|0, low: v.low|0 }
                : null;
            };
            const prodJson = read("prod.json");
            const devJson = read("dev.json");
            const prod = sev(prodJson);
            const dev = sev(devJson);

            // Advisories the repo has deliberately parked. dependabot.yml
            // carries the reason beside each ignore, so a known-and-accepted
            // finding is reported as parked rather than as a new problem.
            let parked = [];
            try {
              const yml = fs.readFileSync(".github/dependabot.yml", "utf8");
              parked = [...yml.matchAll(/dependency-name:\s*"?([^"\n]+)"?/g)]
                .map((m) => ({ package: m[1].trim(), reason: "ignored in dependabot.yml" }));
            } catch {}

            const findings = [];
            const vulns = (devJson && devJson.vulnerabilities) || {};
            for (const [name, v] of Object.entries(vulns)) {
              if (v && (v.severity === "critical" || v.severity === "high")) {
                findings.push({
                  package: name,
                  severity: v.severity,
                  via: Array.isArray(v.via)
                    ? v.via.map((x) => (typeof x === "string" ? x : x.title)).filter(Boolean).join("; ").slice(0, 300)
                    : "",
                });
              }
            }

            const body = {
              repo: process.env.GITHUB_REPOSITORY,
              ref: process.env.GITHUB_REF_NAME,
              commit_sha: process.env.GITHUB_SHA,
              prod: prod || undefined,
              dev: dev || undefined,
              parked,
              top_findings: findings,
              // UNKNOWN IS NOT ZERO. If npm audit could not produce a
              // report, say so — never let a failed audit read as a clean one.
              audit_error: (!prod || !dev)
                ? "npm audit did not produce a parseable report (missing or broken lockfile?)"
                : undefined,
            };

            fetch(process.env.PORTAL_URL + "/api/master/audit", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                authorization: "Bearer " + process.env.PORTAL_INGEST_SECRET,
              },
              body: JSON.stringify(body),
            })
              .then(async (r) => {
                console.log("portal responded", r.status, await r.text());
                if (!r.ok) process.exit(1);
              })
              .catch((e) => { console.error(e); process.exit(1); });
          '
