version: 2

# BEFORE ADDING AN `overrides` ENTRY to package.json, read
# scripts/check-overrides.mjs. An override on a package that is ALSO a direct
# dependency must use the "$name" reference form. Pinning it to a literal range
# installs fine and passes CI, then kills this updater with EOVERRIDE the first
# time it tries to bump that package — which silently stopped every security
# update on this repo for 11 days in August 2026. CI now enforces the rule.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native (Go) compiler. It does not expose the JS
      # compiler API that Next.js uses for its built-in typecheck — the build
      # fails with "TypeScript 7.x does not provide the compiler API required
      # by Next.js. Enable experimental.useTypeScriptCli ... or install
      # TypeScript 6 instead." typescript-eslint also still pins its peer to
      # typescript >=4.8.4 <6.1.0, so lint tooling excludes 7.x as well.
      # We are NOT turning on an experimental Next.js flag in production for a
      # devDependency bump. Drop this ignore once Next.js supports the TS 7
      # compiler API on the stable path (verified 2026-07-27, Next 16.2.12).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # ESLint 10 removed the legacy rule-context APIs (context.getFilename et
      # al). eslint-config-next's bundled eslint-plugin-react still calls them,
      # so `next lint` crashes with exit code 2 (usedPropTypes.js) — PR #34's
      # CI run proved it on this repo, same failure bishopbend-showcase and
      # machine-template hit. Minor/patch and security updates still flow.
      # Drop this ignore once eslint-config-next declares ESLint 10 support
      # (verified 2026-08-04, eslint-config-next bundled with Next 16.2.12).
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Mirror the npm pattern: batch minor+patch action bumps into ONE PR so they
    # auto-merge together, instead of opening a separate PR per action every
    # cycle. Majors stay individual and wait for a human, because a major action
    # bump can change runner behaviour silently.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
